<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="Game UNO" />
	<title>UNO Game</title>
</head>

<body>
	<header>
		<h1>Uno game</h1>
	</header>

	<main>
		<section>
			<h2>Create Game</h2>
			<p>Create new Game</p>
			<button id="create">Create</button>
		</section>
		<section>
			<h2>Join to a Game</h2>
			<p>Join to a game using game code</p>
			<input id="joininput" type="text" />
			<button id="join">Join</button>
		</section>
		<section>
			<input type="text" id="mensaje" placeholder="Write a message ...">
			<button id="enviar">Enviar</button>
			<pre id="log"></pre>
		</section>
	</main>


	<script src="main.js">
	</script>
</body>

</html>
